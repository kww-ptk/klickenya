name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
  # Lets the Studio be redeployed on demand. Without this the only way to
  # recover from a failed deploy is to push another change under apps/studio,
  # which is why a month of failures went unnoticed and unfixed.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup v4 errors out when the
      # version is pinned in both the workflow and package.json's
      # "packageManager" field, which is why Studio deploys have failed since
      # July. package.json is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      - name: Deploy Sanity Studio
        working-directory: apps/studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}
        run: npx sanity deploy
